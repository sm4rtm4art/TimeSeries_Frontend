version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/src"
    schedule:
      interval: "weekly"
    # Align with GitHub's default: delay direct version updates 3 days so
    # brand-new releases are not proposed immediately. Transitive freshness
    # is still enforced at install time by src/pnpm-workspace.yaml
    # (minimumReleaseAge: 1440).
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Tailwind v4 requires a PostCSS/config migration (@tailwindcss/postcss).
      # Remove this once the project migrates off Tailwind v3.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
